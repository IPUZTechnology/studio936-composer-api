# Configuración de Wrangler para "Escenario" (backend de Studio 936)
name = "studio936-escenario-api"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# --- D1: base de datos (usuarios, canciones publicadas, listas, reacciones) ---
[[d1_databases]]
binding = "DB"
database_name = "studio936-escenario"
database_id = "a8702683-2da2-448b-bd6a-d8284f8f20df"

# --- R2: almacenamiento (audio, video, carátulas) ---
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "studio936-escenario-media"

# --- Variables de entorno no secretas ---
[vars]
ENVIRONMENT = "production"
BETTER_AUTH_URL = "https://studio936-escenario-api.ripuz.workers.dev"

# Nota sobre secretos: NUNCA van en este archivo. Se configuran con:
#   wrangler secret put NOMBRE_DEL_SECRETO
